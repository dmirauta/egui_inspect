[package]
name = "egui_inspect"
version = "0.35.0"
edition = "2021"
description = "Easily creating UI to preview and edit data"
readme = "../README.md"
license = "MIT"
categories = ["gui"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
egui = "0.35"
eframe = {version="0.35", features=["glow"]}
egui_plot = {version = "0.36", optional = true} # NOTE: seemingly its version is out of step with the rest
egui_extras = { version = "0.35", features = ["datepicker"], optional = true }
egui_inspect_derive = { path = "../egui_inspect_derive" }

derive-getters = "0.5"
fuzzy-matcher = "0.3.7"

toml = { version = "0.8.14", optional = true }
chrono = { version = "0.4.38", optional = true }  # TODO: use jiff only
jiff = { version = "0.2.24", optional = true }

log = { version = "0.4.22", optional = true }
fern = { version = "0.7", optional = true }

[features]
toml = ["dep:toml", "dep:egui_extras", "dep:jiff"]
logging = ["dep:log", "dep:fern", "dep:chrono"]
plotting = ["dep:egui_plot"]
